<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>台风生存战</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="game"></div>
      <div id="ui">
        <div id="hud">
          <div class="hud-left">
            <div id="hpwrap">
              <div id="hpfill"></div>
              <div id="hpcap"></div>
              <div id="hpghost"></div>
            </div>
            <div id="hpnum">100 / 100</div>
          </div>
          <div class="hud-center">
            <div id="time">00:00</div>
            <div id="nextcard">下次卡牌 60s</div>
          </div>
          <div class="hud-right">
            <div id="gold">金币 0</div>
            <div id="rate">击杀率 --</div>
          </div>
        </div>

        <div id="weapons"></div>

        <div id="joy"><div id="joyknob"></div></div>

        <button id="music" type="button">音乐 开</button>

        <button id="house" type="button">
          <span class="house-label">房子</span>
          <span class="house-cd" id="house-cd">READY</span>
        </button>

        <div id="cards" class="hidden"></div>

        <div id="title" class="overlay">
          <div class="fui-win">
            <aside class="fui-side">
              <div class="fui-brand">
                <b>台风生存战</b>
                <i>TYPHOON SURVIVAL</i>
              </div>
              <nav class="fui-nav" id="titleNav">
                <button type="button" class="fui-nav-item on" data-tab="home"><span>开始</span></button>
                <button type="button" class="fui-nav-item" data-tab="codex"><span>图鉴</span></button>
                <button type="button" class="fui-nav-item" data-tab="settings"><span>设置</span></button>
              </nav>
            </aside>

            <main class="fui-main">
              <section class="fui-page" data-page="home">
                <p>你是一名普通市民，需要躲避飓风和雷雨的伤害，清除飓风和雷雨后，可以吸收留下的能量点，用于升级属性。能量点中，有一定概率刷新出红色能量点，吸收可以回血。WASD / 摇杆控制方向，房子可以清空范围内的飓风和雷雨。</p>
                <button id="start" class="fui-btn" type="button">开始游戏</button>
              </section>

              <section class="fui-page" data-page="codex" hidden>
                <h2>图鉴</h2>
                <div class="fui-codex" id="codex"></div>
              </section>

              <section class="fui-page" data-page="settings" hidden>
                <h2>设置</h2>
                <div class="fui-row">
                  <span>音乐</span>
                  <label class="fui-toggle"><input type="checkbox" id="setMusic" /><i></i></label>
                </div>
                <div class="fui-row">
                  <span>音量</span>
                  <div class="fui-slider-wrap">
                    <input id="setVolume" class="fui-range" type="range" min="0" max="100" step="1" value="100" />
                    <b id="volVal">100</b>
                  </div>
                </div>
                <div class="fui-row">
                  <span>难度</span>
                  <div class="fui-seg">
                    <button type="button" class="on" disabled>普通</button>
                    <button type="button" disabled>困难</button>
                    <button type="button" disabled>噩梦</button>
                  </div>
                </div>
                <p class="fui-note">难度调整后续开放</p>

                <h3 class="fui-sub">关于</h3>
                <div class="fui-links">
                  <a href="https://beijiu.top/" target="_blank" rel="noreferrer">网站 · beijiu.top</a>
                  <a href="https://space.bilibili.com/3745019517210321" target="_blank" rel="noreferrer">B站 · 空间</a>
                </div>
                <p class="fui-note">背景风声由 WebAudio 实时合成，不含音频素材。</p>
              </section>
            </main>
          </div>
        </div>
        <div id="gate" class="hidden">
          <div class="gate-box">
            <b>请把手机横过来</b>
            <p>横屏后才能开始游戏</p>
            <button id="gateGo" type="button" disabled>进入游戏</button>
          </div>
        </div>

        <div id="over" class="overlay hidden"></div>
        <div id="flash"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
